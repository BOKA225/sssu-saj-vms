name: sssu_mobile
description: SSSU-SAJ VMS – application Android des équipes de terrain.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.18.0
  connectivity_plus: ^6.0.5
  cryptography_flutter: ^2.3.2
  drift: ^2.20.0
  excel: ^4.0.6
  file_picker: ^8.1.2
  google_mlkit_text_recognition: ^0.14.0
  image: ^4.2.0
  image_picker: ^1.1.2
  pdfrx: ">=1.0.94 <1.0.102"
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  path: ^1.9.0
  path_provider: ^2.1.4
  sqlcipher_flutter_libs: ^0.6.4
  sqlite3: ^2.4.6
  sssu_core:
    path: ../sssu_core

dev_dependencies:
  build_runner: ^2.4.12
  drift_dev: ^2.20.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/oms/
