name: sssu_windows
description: SSSU-SAJ VMS – poste central Windows (base, synchronisation, gestion).
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  basic_utils: ^5.7.0
  collection: ^1.18.0
  cryptography: ^2.7.0
  excel: ^4.0.6
  ffi: ^2.1.3
  fl_chart: ^0.69.0
  file_picker: ^8.1.2
  flutter_localizations:
    sdk: flutter
  image: ^4.2.0
  pdfrx: ^1.1.0
  flutter_riverpod: ^2.5.1
  path: ^1.9.0
  path_provider: ^2.1.4
  postgres: ^3.4.0
  qr_flutter: ^4.1.0
  shelf: ^1.4.1
  win32: ^5.5.4
  sssu_core:
    path: ../sssu_core

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/polices/
